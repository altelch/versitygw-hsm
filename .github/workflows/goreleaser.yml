name: goreleaser
permissions:
  contents: write
on:
  push:
    # run only against tags
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Snapshot build (no tag, nothing published)"
        type: boolean
        default: true

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --force --tags

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Run Releaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: ${{ inputs.snapshot == 'true' && 'release --snapshot --clean --skip=publish' || 'release --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
